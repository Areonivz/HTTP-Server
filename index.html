<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacrosse Shooting Analytics Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="panel-header">
                <h2>🏒 Lacrosse Analytics</h2>
                
                <div class="input-group">
                    <label>Hudl Game Link</label>
                    <input type="text" id="hudlLink" placeholder="Enter Hudl video URL...">
                    <button class="btn btn-primary" onclick="createGameSession()">Create Session</button>
                </div>

                <div class="input-group">
                    <label>Import Player Roster (CSV)</label>
                    <input type="file" id="csvFile" accept=".csv" onchange="handleCSVUpload(event)">
                    <button class="btn sample-data-btn" onclick="loadSampleData()">Load Sample Squad Data</button>
                </div>

                <div class="input-group">
                    <label>Import Session Data (JSON)</label>
                    <input type="file" id="jsonFile" accept=".json" onchange="handleJSONUpload(event)">
                </div>

                <div class="mode-toggle">
                    <button class="mode-btn active" id="shooterMode" onclick="setMode('shooter')">Shooter</button>
                    <button class="mode-btn" id="gkMode" onclick="setMode('goalkeeper')">Goalkeeper</button>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-group">
                    <label>Filter by Position</label>
                    <select id="positionFilter" onchange="updatePlayerList()">
                        <option value="all">All Players</option>
                        <option value="outfield">Outfield Players</option>
                        <option value="goalkeeper">Goalkeepers</option>
                    </select>
                </div>
            </div>

            <div class="player-list" id="playerList">
                <div style="text-align: center; color: #666; padding: 40px;">
                    Upload CSV or load sample data
                </div>
            </div>

            <div class="export-section">
                <button class="btn btn-secondary" onclick="exportData()" style="width: 100%;">
                    📊 Export All Data
                </button>
                <button class="btn btn-secondary" onclick="clearAllData()" style="width: 100%; margin-top: 10px;">
                    🗑️ Clear All Data
                </button>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="game-info">
                <div class="current-game" id="currentGameDisplay">No Game Selected</div>
                <div class="current-player-display" id="currentPlayerDisplay">No Player Selected</div>
            </div>

            <div class="field-container">
                <svg id="goalField" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Field Background -->
                    <rect width="800" height="600" fill="#2d5a27" stroke="#1a3a17" stroke-width="2"/>
                    
                    <!-- Goal Area -->
                    <g id="goalArea">
                        <!-- Goal -->
                        <rect x="350" y="250" width="100" height="80" fill="#fff" stroke="#333" stroke-width="3"/>
                        <line x1="350" y1="250" x2="450" y2="330" stroke="#333" stroke-width="2"/>
                        <line x1="350" y1="330" x2="450" y2="250" stroke="#333" stroke-width="2"/>
                        
                        <!-- Crease -->
                        <circle cx="400" cy="350" r="60" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5,5"/>
                        
                        <!-- Zones -->
                        <path id="zone1" class="zone" d="M 200 150 L 350 200 L 350 280 L 200 250 Z" 
                              fill="#e94560" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(1)"/>
                        <text x="275" y="220" class="zone-label">Top Left</text>
                        <text x="275" y="240" class="zone-stats" id="stats1">0%</text>

                        <path id="zone2" class="zone" d="M 350 150 L 450 150 L 450 250 L 350 250 Z" 
                              fill="#e94560" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(2)"/>
                        <text x="400" y="200" class="zone-label">Top Center</text>
                        <text x="400" y="220" class="zone-stats" id="stats2">0%</text>

                        <path id="zone3" class="zone" d="M 450 150 L 600 150 L 600 250 L 450 280 Z" 
                              fill="#e94560" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(3)"/>
                        <text x="525" y="220" class="zone-label">Top Right</text>
                        <text x="525" y="240" class="zone-stats" id="stats3">0%</text>

                        <path id="zone4" class="zone" d="M 200 280 L 350 280 L 350 350 L 200 350 Z" 
                              fill="#3742fa" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(4)"/>
                        <text x="275" y="320" class="zone-label">Mid Left</text>
                        <text x="275" y="340" class="zone-stats" id="stats4">0%</text>

                        <path id="zone5" class="zone" d="M 350 280 L 450 280 L 450 350 L 350 350 Z" 
                              fill="#ffa502" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(5)"/>
                        <text x="400" y="320" class="zone-label">Crease</text>
                        <text x="400" y="340" class="zone-stats" id="stats5">0%</text>

                        <path id="zone6" class="zone" d="M 450 280 L 600 280 L 600 350 L 450 350 Z" 
                              fill="#3742fa" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(6)"/>
                        <text x="525" y="320" class="zone-label">Mid Right</text>
                        <text x="525" y="340" class="zone-stats" id="stats6">0%</text>

                        <path id="zone7" class="zone" d="M 200 380 L 350 380 L 350 480 L 200 450 Z" 
                              fill="#00d26a" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(7)"/>
                        <text x="275" y="430" class="zone-label">Low Left</text>
                        <text x="275" y="450" class="zone-stats" id="stats7">0%</text>

                        <path id="zone8" class="zone" d="M 350 380 L 450 380 L 450 480 L 350 480 Z" 
                              fill="#00d26a" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(8)"/>
                        <text x="400" y="430" class="zone-label">Low Center</text>
                        <text x="400" y="450" class="zone-stats" id="stats8">0%</text>

                        <path id="zone9" class="zone" d="M 450 380 L 600 380 L 600 450 L 450 480 Z" 
                              fill="#00d26a" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(9)"/>
                        <text x="525" y="430" class="zone-label">Low Right</text>
                        <text x="525" y="450" class="zone-stats" id="stats9">0%</text>

                        <path id="zone10" class="zone" d="M 300 480 L 500 480 L 550 550 L 250 550 Z" 
                              fill="#a55eea" opacity="0.6" stroke="#fff" stroke-width="1"
                              onclick="handleZoneClick(10)"/>
                        <text x="400" y="520" class="zone-label">Behind (X)</text>
                        <text x="400" y="540" class="zone-stats" id="stats10">0%</text>
                    </g>

                    <!-- Field markings -->
                    <line x1="400" y1="0" x2="400" y2="600" stroke="#fff" stroke-width="2" opacity="0.3"/>
                    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="2" opacity="0.3"/>
                </svg>
            </div>

            <div class="controls">
                <div id="shooterControls">
                    <div class="zone-indicator" id="shooterZoneIndicator">Select a zone on the field</div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="last5Seconds" name="last5Seconds">
                        <label for="last5Seconds">⏱️ Conceded in Last 5 Seconds of Shot Clock</label>
                    </div>
                    <div class="control-buttons">
                        <button class="action-btn btn-goal" onclick="recordShot('goal')">
                            ⚽ Goal/Scored
                        </button>
                        <button class="action-btn btn-miss" onclick="recordShot('miss')">
                            ❌ Miss/Saved
                        </button>
                    </div>
                </div>

                <div id="gkControls" class="hidden">
                    <div class="zone-indicator" id="gkZoneIndicator">Select a zone on the field</div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="gkLast5Seconds" name="gkLast5Seconds">
                        <label for="gkLast5Seconds">⏱️ Goal Conceded in Last 5 Seconds</label>
                    </div>
                    <div class="control-buttons">
                        <button class="action-btn btn-save" onclick="recordGKStat('save')">
                            🧤 Shot Saved
                        </button>
                        <button class="action-btn btn-miss" onclick="recordGKStat('conceded')">
                            🥅 Goal Conceded
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="script.js"></script>
</body>
</html>
